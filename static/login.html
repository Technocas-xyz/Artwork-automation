<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Artwork Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#1a1a1a}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:40px;width:100%;max-width:380px}
.card h1{font-size:1.2rem;font-weight:700;margin-bottom:6px}
.card p{font-size:.82rem;color:#6b7280;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.76rem;font-weight:600;color:#6b7280;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid #e2e5e9;border-radius:8px;font-size:.9rem}
.field input:focus{border-color:#2563eb;outline:none}
.btn{width:100%;padding:12px;font-size:.92rem;font-weight:600;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:.15s}
.btn:hover{background:#1d4ed8}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.error{color:#dc2626;font-size:.8rem;margin-top:12px;display:none}
.error.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Artwork Generator</h1>
  <p>Sign in to continue</p>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">Sign in</button>
    <div class="error" id="loginError"></div>
  </form>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  var btn = document.getElementById("loginBtn");
  var err = document.getElementById("loginError");
  err.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Signing in...";
  fetch("/api/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  }).then(function(r) {
    if (r.ok) { window.location.href = "/"; }
    else { return r.json().then(function(d) { throw new Error(d.detail || "Login failed"); }); }
  }).catch(function(ex) {
    err.textContent = ex.message;
    err.classList.add("show");
    btn.disabled = false;
    btn.textContent = "Sign in";
  });
});
</script>
</body>
</html>
