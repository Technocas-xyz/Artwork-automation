services:
  artwork-automation:
    build: .
    container_name: artwork_automation
    restart: unless-stopped
    env_file: .env
    shm_size: '1gb'
    ports:
      - "4400:8000"   # web UI
      - "4401:6080"   # noVNC (browser desktop, for ChatGPT sign-in)
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
      - ./vault:/app/vault
      - ./profiles:/app/profiles
      # Agent bearer tokens and the packaged agent download must outlive a
      # rebuild, or every designer's agent loses auth and the download 404s.
      - ./agent_tokens.json:/app/agent_tokens.json
      - ./downloads:/app/downloads
